<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Nueva incidencia</title>

    <link href="https://fonts.googleapis.com/css2?family=Athiti&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <img src="assets/img/JJL_logo.svg" alt="Logo JJL" class="logo-fixed">

    <div class="top-bar">
        <h1>NUEVA INCIDENCIA</h1>
    </div>

    <div class="container incidencia-form">
        <form action="crear-incidencia" method="post">

            <div class="fila-doble">
                <div class="campo">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni">
                </div>

                <div class="campo fecha">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" required></textarea>
            </div>

            <div class="campo">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones"></textarea>
            </div>

            <button type="submit">REGISTRAR</button>

        </form>
    </div>

</body>
</html>
